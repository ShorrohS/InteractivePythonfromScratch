    // Find requested path from pathname
    let path = location.pathname;
    // Strip repository root prefix e.g. /InteractivePythonfromScratch/
    path = path.replace(/^\/InteractivePythonfromScratch\/?/i, '').replace(/^\//, '');
    document.getElementById('target-path-info').textContent = path;

    // Search for matching file
    function findMatch(req) {
      if (!req) return null;
      req = req.toLowerCase().replace(/\\/g, '/');
      const basename = req.split('/').pop();

      // 1. Exact ends-with match
      for (const f of KNOWN_FILES) {
        if (f.toLowerCase().endsWith(req)) return f;
      }
      // 2. Basename match
      if (basename) {
        for (const f of KNOWN_FILES) {
          if (f.toLowerCase().endsWith('/' + basename) || f.toLowerCase() === basename) return f;
        }
      }
      // 3. Substring match
      for (const f of KNOWN_FILES) {
        if (f.toLowerCase().includes(basename)) return f;
      }
      return null;
    }

    const matched = findMatch(path);

    if (matched) {
      // Determine destination
      const repoBase = location.pathname.startsWith('/InteractivePythonfromScratch') ? '/InteractivePythonfromScratch/' : '/';
      const dest = repoBase + 'lesson.html?path=' + encodeURIComponent(matched);
      window.location.replace(dest);
    } else {
      // Show fallback UI
      document.getElementById('redirect-spinner').classList.add('hidden');
      document.getElementById('fallback-ui').classList.remove('hidden');

      const input = document.getElementById('search-input');
      const results = document.getElementById('search-results');

      function doSearch(q) {
        results.innerHTML = '';
        if (!q || q.length < 2) return;
        const ql = q.toLowerCase();
        const matches = KNOWN_FILES.filter(f => f.toLowerCase().includes(ql)).slice(0, 8);
        if (matches.length === 0) {
          results.innerHTML = '<div class="text-xs font-mono text-slate-500 py-2">No matching lessons found.</div>';
          return;
        }
        matches.forEach(m => {
          const a = document.createElement('a');
          a.href = 'lesson.html?path=' + encodeURIComponent(m);
          a.className = 'block p-2 rounded-lg bg-white/5 hover:bg-cyan-500/10 hover:text-cyan-400 border border-white/5 transition text-xs font-mono truncate';
          a.textContent = m.replace('Python-Mastery-Academy/', '');
          results.appendChild(a);
        });
      }

      input.addEventListener('input', e => doSearch(e.target.value));
      // Pre-populate with query if available
      if (path) {
        input.value = path.split('/').pop().replace(/\.[^/.]+$/, "");
        doSearch(input.value);
      }
    }
