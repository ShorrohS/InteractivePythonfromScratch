          a.className = 'hover:text-cyan-400 transition truncate max-w-[6rem]';
          a.textContent = part.replace(/-/g,' ');
          bc.appendChild(a);
          const sep = document.createElement('span');
          sep.className = 'text-slate-700 mx-1';
          sep.textContent = '/';
          bc.appendChild(sep);
        }
      });
    }

    function resolvePath(path) {
      const parts = path.split('/');
      const r = [];
      for (const p of parts) { if (p==='..') r.pop(); else if (p!=='.') r.push(p); }
      return r.join('/');
    }

    function resolveRelativeUrl(href) {
      if (!href || /^(https?:\/\/|mailto:|tel:|#)/i.test(href)) return href;
      const base = rawPath.substring(0, rawPath.lastIndexOf('/') + 1);
      return resolvePath(base + href);
    }

    // Configure marked renderer
    const renderer = new marked.Renderer();

    renderer.link = function(href, title, text) {
      if (!href) return `<a>${text}</a>`;
      if (/^(https?:\/\/|mailto:|tel:|#)/i.test(href)) {
        const isExt = /^https?:\/\//i.test(href);
        return `<a href="${href}" ${isExt ? 'target="_blank" rel="noopener"' : ''}>${text}</a>`;
      }

      // Resolve relative path
      let resolved = resolveRelativeUrl(href);
      const cleanTarget = resolved.replace(/[?#].*$/, '');
      const ext = cleanTarget.includes('.') ? cleanTarget.split('.').pop().toLowerCase() : '';

      // If directory link (e.g. guided-projects/project-01-greeting-app/)
      if (!ext) {
        const baseDir = cleanTarget.endsWith('/') ? cleanTarget : cleanTarget + '/';
        const withReadme = baseDir + 'README.md';
        const withMain = baseDir + 'main.py';
        if (KNOWN_FILES.has(withReadme)) resolved = withReadme;
        else if (KNOWN_FILES.has(withMain)) resolved = withMain;
        else resolved = withReadme;
      }

      if (resolved.endsWith('.html')) {
        return `<a href="${resolved}">${text}</a>`;
      }

      return `<a href="lesson.html?path=${encodeURIComponent(resolved)}">${text}</a>`;
    };

    renderer.image = function(href, title, text) {
      if (!href) return '';
      let src = href;
      if (!/^(https?:\/\/|data:)/i.test(href)) {
        src = resolveRelativeUrl(href);
      }
      return `<img src="${src}" alt="${text || ''}" title="${title || ''}" class="rounded-xl border border-white/10 my-4 max-w-full">`;
    };

    renderer.code = function(code, lang) {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      let hi;
      try {
        if (typeof hljs !== 'undefined') {
          const vl = lang && hljs.getLanguage && hljs.getLanguage(lang) ? lang : '';
          hi = vl ? hljs.highlight(code,{language:vl}).value : hljs.highlightAuto(code).value;
        } else {
          hi = esc(code);
        }
      } catch(e) {
        hi = esc(code);
      }
      const lbl = lang ? `<span class="lang-label">${lang}</span>` : '';
      const cp = `<button class="copy-btn" onclick="copyCode(this)">copy</button>`;
      return `<pre class="relative">${lbl}<code class="hljs">${hi}</code>${cp}</pre>`;
    };

    renderer.listitem = function(...args) {
      let text, task, checked;
      if (typeof args[0] === 'object' && args[0] !== null) {
        text = args[0].text || '';
        task = args[0].task;
        checked = args[0].checked;
      } else {
        text = args[0] || '';
        task = args[1];
        checked = args[2];
      }
      const isTask = task || /^<input[^>]*type="checkbox"/i.test(text) || /^\[[ x]\]/.test(text);
      if (isTask) {
        const isChecked = checked || /checked/i.test(text) || /^\[x\]/.test(text);
        const cleanText = text.replace(/^<input[^>]*>\s*/i, '').replace(/^\[[ x]\]\s*/, '');
        return `<li class="task-item"><label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" ${isChecked ? 'checked' : ''} disabled class="mt-1"><span>${cleanText}</span></label></li>\n`;
      }
      return `<li>${text}</li>\n`;
    };

    marked.use({renderer, breaks:true, gfm:true});

    function copyCode(btn) {
      navigator.clipboard.writeText(btn.closest('pre').querySelector('code').innerText).then(()=>{
        btn.textContent='copied!'; btn.style.color='#10b981';
        setTimeout(()=>{btn.textContent='copy';btn.style.color='';},2000);
      });
    }

    function buildTOC() {
      const toc = document.getElementById('toc');
      const hs = document.querySelectorAll('.md-body h2, .md-body h3');
      if (hs.length < 2) { toc.innerHTML='<span style="color:#334155;font-size:.7rem">No sections</span>'; return; }
      toc.innerHTML = '';
      hs.forEach((h,i) => {
        const id = 'sec-'+i; h.id=id;
        const a = document.createElement('a');
        a.href = '#'+id;
        a.className = 'toc-link' + (h.tagName==='H3'?' toc-h3':'');
        a.textContent = h.textContent.trim();
        a.addEventListener('click', e => { e.preventDefault(); h.scrollIntoView({behavior:'smooth',block:'start'}); });
        toc.appendChild(a);
      });
      const obs = new IntersectionObserver(entries => {
        entries.forEach(en => {
          const el = toc.querySelector('a[href="#'+en.target.id+'"]');
          if (el) el.classList.toggle('active', en.isIntersecting);
        });
      }, {rootMargin:'-20px 0px -70% 0px'});
      hs.forEach(h => obs.observe(h));
    }

    window.addEventListener('scroll', () => {
      const docH = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docH>0 ? Math.round(window.scrollY/docH*100) : 0;
      document.getElementById('read-progress').style.width = pct+'%';
      document.getElementById('read-pct').textContent = pct+'%';
    });

    function extractMeta(text) {
      const m = {}; const lines = text.split('\n').slice(0,15);
      for (const l of lines) {
        if (/Phase:/i.test(l)) m.phase = l.replace(/.*Phase:\*?\*?\s*/i,'').trim();
        if (/Time:/i.test(l)) m.time = l.replace(/.*Time:\*?\*?\s*/i,'').trim();
        if (/Prerequisite:/i.test(l)) m.prereq = l.replace(/.*Prerequisite:\*?\*?\s*/i,'').trim();
      }
      return m;
    }

    const REPO = 'ShorrohS/InteractivePythonfromScratch';
    const BRANCH = 'main';
    const CDN_URL = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${rawPath}`;

    async function load() {
      buildBreadcrumb(rawPath);
      try {
        let res = await fetch(rawPath);
        if (!res.ok) {
          res = await fetch(CDN_URL);
        }
        if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        const text = await res.text();

        const fileExt = rawPath.split('.').pop().toLowerCase();
        const fileName = rawPath.split('/').pop();
        let contentToRender = text;

        if (fileExt === 'py') {
          document.title = fileName + ' — Python Mastery Academy';
          contentToRender = `# 🐍 \`${fileName}\`\n\n` +
            `> **Python Source Script** • Master implementation details & syntax.\n\n` +
            `\`\`\`python\n${text}\n\`\`\`\n\n` +
            `---\n\n` +
            `### ⚡ Run this script locally:\n` +
            `\`\`\`bash\npython "${rawPath}"\n\`\`\``;
        } else if (['json', 'sql', 'sh', 'txt', 'csv'].includes(fileExt)) {
          document.title = fileName + ' — Python Mastery Academy';
          contentToRender = `# 📄 \`${fileName}\`\n\n\`\`\`${fileExt}\n${text}\n\`\`\``;
        } else {
          const h1 = text.match(/^#\s+(.+)$/m);
          document.title = (h1 ? h1[1] : fileName.replace('.md','')) + ' — Python Mastery Academy';
        }

        const meta = extractMeta(text);
        if (meta.phase || meta.time) {
          document.getElementById('meta-card').classList.remove('hidden');
          if (meta.phase) document.getElementById('meta-phase').textContent = meta.phase;
          if (meta.time) document.getElementById('meta-time').querySelector('span').textContent = meta.time;
          if (meta.prereq) document.getElementById('meta-prereq').textContent = 'Requires: ' + meta.prereq;
        }

        const out = document.getElementById('md-output');
        out.innerHTML = marked.parse(contentToRender);
        document.getElementById('skeleton').classList.add('hidden');
        out.classList.remove('hidden');
        document.getElementById('bottom-nav').classList.remove('hidden');
        document.getElementById('file-info').textContent = fileName;
        buildTOC();
      } catch(err) {
        document.getElementById('skeleton').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');

        // Check if this belongs to a known phase
        const phaseMatch = rawPath.match(/(phase-\d+-[^/]+)/);
        if (phaseMatch) {
          const phaseName = phaseMatch[1];
          const parentReadme = 'Python-Mastery-Academy/' + phaseName + '/README.md';
          const pLink = document.getElementById('phase-parent-link');
          pLink.href = 'lesson.html?path=' + encodeURIComponent(parentReadme);
          pLink.textContent = 'View ' + phaseName.replace(/-/g, ' ') + ' &#8594;';
          pLink.classList.remove('hidden');
        }

        const isPlanned = rawPath.includes('concept') || rawPath.includes('lesson-');
        if (isPlanned) {
          document.getElementById('state-icon').innerHTML = '&#128640;';
          document.getElementById('state-title').textContent = 'Lesson In Progress';
          document.getElementById('error-msg').textContent = 'This module ("' + rawPath.split('/').pop().replace(/\.[^/.]+$/, '') + '") is currently in development as part of the full-stack curriculum roadmap. Check out the phase overview below or explore other lessons!';
        } else {
          document.getElementById('state-icon').innerHTML = '&#128269;';
          document.getElementById('state-title').textContent = 'Page Not Found';
          document.getElementById('error-msg').textContent = 'Could not load "' + rawPath + '". ' + err.message;
        }
        document.title = 'Module In Progress — Python Mastery Academy';
      }
    }

    load();
  </script>
</body>
</html>
